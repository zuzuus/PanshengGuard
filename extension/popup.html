<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PanshengGuard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <header class="top">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M8 12h8"/></svg>
      </span>
      <span class="brand-name">PanshengGuard</span>
    </div>
    <span class="kicker">Email threat analysis</span>
  </header>

  <div id="status" class="status" role="status" aria-live="polite">Not connected yet.</div>

  <section class="block">
    <h1>Analyze an email</h1>
    <p class="sub">Open a message in Gmail and press <strong>Scan with PanshengGuard</strong>, or paste one below.</p>

    <label for="paste" class="sr-only">Email content</label>
    <textarea id="paste" rows="5" placeholder="Subject line, then the email body…"></textarea>
    <button id="scan" class="btn btn-primary btn-block">Analyze email</button>
    <p class="hint">Works even if Gmail's layout changes and the in-page button cannot attach.</p>
  </section>

  <div id="verdict" class="verdict" aria-live="polite"></div>

  <details class="settings" id="settings">
    <summary>
      <span>Connection settings</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </summary>

    <div class="settings-body">
      <label for="apiBase">Server address</label>
      <input id="apiBase" type="text" placeholder="http://127.0.0.1:8001" spellcheck="false">

      <label for="token">API token</label>
      <input id="token" type="password" placeholder="Paste from your profile page" spellcheck="false">

      <div class="row">
        <button id="save" class="btn btn-primary">Save</button>
        <button id="test" class="btn">Test connection</button>
      </div>
    </div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
